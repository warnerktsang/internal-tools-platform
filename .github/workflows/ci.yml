name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itp
          POSTGRES_PASSWORD: itp
          POSTGRES_DB: itp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U itp -d itp"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://itp:itp@localhost:5433/itp?schema=public
      SESSION_SECRET: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate:deploy

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
